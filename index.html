
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CHAOTEN-TV | 24/7 UNFILTERED</title>
  <style>
    body {
      margin: 0;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    h1 { margin: 20px; }
    video {
      width: 100%;
      height: 80vh;
      object-fit: contain;
      background: black;
    }
  </style>
</head>
<body>
  <h1>CHAOTEN-TV | 24/7 UNFILTERED</h1>
  <video id="player" controls autoplay muted playsinline></video>

  <script>
    const videos = [
      "videos/video1.mp4",
      "videos/video2.mp4"
    ];
    let current = 0;
    const player = document.getElementById("player");

    function playVideo() {
      player.src = videos[current];
      player.load();
      player.play().catch(() => {});
    }

    player.addEventListener("ended", () => {
      current = (current + 1) % videos.length;
      playVideo();
    });

    playVideo();
  </script>
</body>
</html>
