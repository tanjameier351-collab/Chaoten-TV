
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marc | Music • Emotions • Stories</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}

.screen {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: #000;
}

/* Weichgezeichneter Videohintergrund */
#background {
  position: absolute;
  inset: -10%;
  width: 120%;
  height: 120%;
  object-fit: cover;
  filter: blur(35px) brightness(0.45);
  pointer-events: none;
}

/* Scharfes Hauptvideo */
#player {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: transparent;
}

/* Equalizer links und rechts */
.equalizer {
  position: absolute;
  top: 12%;
  bottom: 12%;
  width: 12%;
  display: flex;
  align-items: center;
  justify-content: space-evenly;
  gap: 3px;
  pointer-events: none;
  opacity: 0.9;
  z-index: 3;
}

.equalizer-left {
  left: 1%;
}

.equalizer-right {
  right: 1%;
}

.bar {
  width: 7%;
  height: 15%;
  border-radius: 4px;
  background: linear-gradient(
    to top,
    #235aff 0%,
    #8850e9 50%,
    #e0e6f5 100%
  );
  box-shadow:
    0 0 8px #477aff,
    0 0 14px #9855f0;
  transform-origin: center;
  animation: equalize 1s ease-in-out infinite alternate;
}

@keyframes equalize {
  0% {
    height: 8%;
    opacity: 0.65;
  }
  35% {
    height: 45%;
  }
  70% {
    height: 22%;
  }
  100% {
    height: 75%;
    opacity: 1;
  }
}

/* Ton einschalten */
#soundButton {
  position: absolute;
  right: 15px;
  bottom: 15px;
  z-index: 10;
  padding: 10px 14px;
  border: 1px solid #9c8be0;
  border-radius: 10px;
  background: rgba(12, 10, 30, 0.8);
  color: #fff;
  font: 14px Arial, sans-serif;
  cursor: pointer;
  box-shadow: 0 0 12px rgba(120, 85, 230, 0.5);
}

#soundButton:hover {
  background: rgba(60, 40, 110, 0.9);
}

@media (max-width: 600px) {
  .equalizer {
    width: 11%;
    gap: 2px;
  }

  #soundButton {
    font-size: 12px;
    padding: 8px 10px;
  }
}
</style>
</head>

<body>

<div class="screen">
  <video id="background" muted playsinline></video>
  <video id="player" autoplay muted playsinline controls></video>

  <div class="equalizer equalizer-left" id="eq-left"></div>
  <div class="equalizer equalizer-right" id="eq-right"></div>

  <button id="soundButton" type="button">
    🔊 Ton einschalten
  </button>
</div>

<script>
const base =
"https://github.com/tanjameier351-collab/Chaoten-TV/releases/download/v1.0/";

const videos = [
  {
    name: "Narben machen dich härter",
    file: "Marc.-.Narben.machen.dich.harter.-.Marc.1080p.mp4",
    duration: 209
  },
  {
    name: "1004",
    file: "1004.1.mp4",
    duration: 273
  },
  {
    name: "After Midnight - Velvet Nights",
    file: "Marc.-.Afther.Midnight.Velvet.Nights.-.Stay.Until.Sunrise.-.Marc.1080p.mp4",
    duration: 276
  },
  {
    name: "Beyond The Night",
    file: "Marc.-.Beyond.The.Night.-.Marc.1080p.mp4",
    duration: 375
  },
  {
    name: "The Things That Stay",
    file: "Marc.-.Country.The.Thinks.That.Stay.-.Marc.1080p.mp4",
    duration: 268
  },
  {
    name: "Break The Static",
    file: "MARC.BREAK.THE.STATIC.Epic.Festival.EDM.Experience.Official.Music.Video.-.Marc.1080p.mp4",
    duration: 231
  },
  {
    name: "Fire in Your Eyes",
    file: "Marc-.Fire.in.Your.Eyes-.480p24.mp4",
    duration:202
  },
  {
    name: "Out of My Head",
    file: "Marc-Out.of.My.Head-.480p24.mp4",
    duration: 235
  },
  {
    name: "Ricomincia Con Me",
    file: "Marc.-.After.Midnight.Velvet.Nights.Ricomincia.Con.Me-.1896p30.mp4",
    duration: 326
  },
  {
    name: "I Just Wanna Breathe Again",
    file: "Marc.-.i.just.wanna.breathe.again-.1896p30.mp4",
    duration: 354
  },
  {
    name: "This Is Me",
    file: "Marc.-.This.is.Me-.1896p30.mp4",
    duration: 239
  },
  {
    name: "Vergangenheit ruht",
    file: "youtube-video.mp4",
    duration: 184
  }
];

const player = document.getElementById("player");
const background = document.getElementById("background");
const soundButton = document.getElementById("soundButton");

const sendestart = Date.UTC(2026, 10, 13, 0, 0, 0);

const totalDuration = videos.reduce(
  (sum, video) => sum + video.duration, 0
);

let currentIndex = -1;

/* Equalizer erzeugen */
function createEqualizer(id) {
  const container = document.getElementById(id);

  for (let i = 0; i < 14; i++) {
    const bar = document.createElement("div");
    bar.className = "bar";

    bar.style.animationDuration =
      (0.45 + Math.random() * 0.9) + "s";

    bar.style.animationDelay =
      (-Math.random() * 2) + "s";

    container.appendChild(bar);
  }
}

createEqualizer("eq-left");
createEqualizer("eq-right");

/* Tonsteuerung */
function updateSoundButton() {
  soundButton.textContent = player.muted
    ? "🔊 Ton einschalten"
    : "🔇 Ton ausschalten";
}

soundButton.addEventListener("click", async () => {
  player.muted = !player.muted;
  player.volume = 1;

  try {
    await player.play();
  } catch (error) {
    console.log("Wiedergabe benötigt Benutzeraktion:", error);
  }

  updateSoundButton();
});

player.addEventListener("volumechange", updateSoundButton);

/* Synchronisierte Playlist */
function getPosition() {
  let elapsed =
    Math.max(0, (Date.now() - sendestart) / 1000)
    % totalDuration;

  for (let i = 0; i < videos.length; i++) {
    if (elapsed < videos[i].duration) {
      return { index: i, seconds: elapsed };
    }
    elapsed -= videos[i].duration;
  }

  return { index: 0, seconds: 0 };
}

function synchronize() {
  const position = getPosition();

  if (currentIndex !== position.index) {
    currentIndex = position.index;

    const url = base + videos[currentIndex].file;

    player.src = url;
    background.src = url;

    player.load();
    background.load();
  }

  if (player.readyState >= 1) {
    const target = Math.min(
      position.seconds,
      Math.max(0, player.duration - 0.2)
    );

    if (Math.abs(player.currentTime - target) > 2) {
      try {
        player.currentTime = target;
      } catch (error) {}
    }

    if (player.paused) {
      player.play().catch(() => {});
    }
  }

  if (background.readyState >= 1) {
    const target = Math.min(
      position.seconds,
      Math.max(0, background.duration - 0.2)
    );

    if (Math.abs(background.currentTime - target) > 0.5) {
      try {
        background.currentTime = target;
      } catch (error) {}
    }

    if (background.paused) {
      background.play().catch(() => {});
    }
  }
}

player.addEventListener("loadedmetadata", synchronize);
background.addEventListener("loadedmetadata", synchronize);

setInterval(synchronize, 3000);
synchronize();
updateSoundButton();
</script>

</body>
</html>
