
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHAOTEN-TV | Neon Test</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}

.screen {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: #000;
}

/* ORIGINAL: verschwommener Videohintergrund */
#background {
  position: absolute;
  inset: -10%;
  width: 120%;
  height: 120%;
  object-fit: cover;
  filter: blur(35px) brightness(0.45);
  pointer-events: none;
}

/* NEU: dezente farbige Lichtatmosphäre */
.ambient {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(
      ellipse at 8% 50%,
      rgba(0, 190, 255, 0.20),
      transparent 42%
    ),
    radial-gradient(
      ellipse at 92% 50%,
      rgba(135, 55, 255, 0.22),
      transparent 42%
    );
}

/* NEU: Soundwave-Flächen */
.waves {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}

.wave {
  position: absolute;
  width: 42vw;
  height: 16vh;
  border-top: 2px solid rgba(60, 220, 255, 0.65);
  border-radius: 50%;
  opacity: 0.65;
  transform-origin: center;
  animation: waveMove 7s ease-in-out infinite alternate;
}

.wave.left {
  left: -12vw;
}

.wave.right {
  right: -12vw;
  transform: scaleX(-1);
}

.wave:nth-child(1) {
  top: 24%;
  border-color: rgba(0, 230, 255, 0.75);
}

.wave:nth-child(2) {
  top: 34%;
  border-color: rgba(35, 130, 255, 0.75);
  animation-delay: -2s;
}

.wave:nth-child(3) {
  top: 44%;
  border-color: rgba(140, 75, 255, 0.75);
  animation-delay: -4s;
}

.wave:nth-child(4) {
  top: 54%;
  border-color: rgba(215, 65, 235, 0.65);
  animation-delay: -1s;
}

.wave:nth-child(5) {
  top: 64%;
  border-color: rgba(0, 200, 255, 0.65);
  animation-delay: -3s;
}

@keyframes waveMove {
  0% {
    translate: 0 -12px;
    scale: 1 0.8;
    opacity: 0.35;
  }

  100% {
    translate: 0 12px;
    scale: 1 1.35;
    opacity: 0.85;
  }
}

/* NEU: Hauptvideo nur so breit wie sein Bild */
#player {
  position: absolute;
  top: 50%;
  left: 50%;
  width: auto;
  height: 100vh;
  max-width: 100vw;
  object-fit: contain;
  transform: translate(-50%, -50%);
  background: transparent;
}

@media (prefers-reduced-motion: reduce) {
  .wave {
    animation: none;
  }
}
</style>
</head>

<body>

<div class="screen">

  <video id="background" muted playsinline></video>

  <div class="ambient"></div>

  <div class="waves">
    <div class="wave left"></div>
    <div class="wave left"></div>
    <div class="wave left"></div>
    <div class="wave left"></div>
    <div class="wave left"></div>

    <div class="wave right"></div>
    <div class="wave right"></div>
    <div class="wave right"></div>
    <div class="wave right"></div>
    <div class="wave right"></div>
  </div>

  <video id="player" autoplay muted playsinline controls></video>

</div>

<script>
/* ORIGINAL-PLAYLIST UND SYNCHRONISIERUNG */

const base =
"https://github.com/tanjameier351-collab/Chaoten-TV/releases/download/v1.0/";

const videos = [
  {
    name: "Narben machen dich härter",
    file: "Marc.-.Narben.machen.dich.harter.-.Marc.1080p.mp4",
    duration: 209
  },
  {
    name: "1004",
    file: "1004.1.mp4",
    duration: 273
  },
  {
    name: "After Midnight - Velvet Nights",
    file: "Marc.-.Afther.Midnight.Velvet.Nights.-.Stay.Until.Sunrise.-.Marc.1080p.mp4",
    duration: 276
  },
  {
    name: "Beyond The Night",
    file: "Marc.-.Beyond.The.Night.-.Marc.1080p.mp4",
    duration: 375
  },
  {
    name: "The Things That Stay",
    file: "Marc.-.Country.The.Thinks.That.Stay.-.Marc.1080p.mp4",
    duration: 268
  },
  {
    name: "Break The Static",
    file: "MARC.BREAK.THE.STATIC.Epic.Festival.EDM.Experience.Official.Music.Video.-.Marc.1080p.mp4",
    duration: 231
  }
];

const player = document.getElementById("player");
const background = document.getElementById("background");

const sendestart = Date.UTC(2026, 10, 13, 0, 0, 0);

const totalDuration = videos.reduce(
  (sum, video) => sum + video.duration, 0
);

let currentIndex = -1;

function getPosition() {
  let elapsed =
    Math.max(0, (Date.now() - sendestart) / 1000)
    % totalDuration;

  for (let i = 0; i < videos.length; i++) {
    if (elapsed < videos[i].duration) {
      return { index: i, seconds: elapsed };
    }

    elapsed -= videos[i].duration;
  }

  return { index: 0, seconds: 0 };
}

function synchronize() {
  const position = getPosition();

  if (currentIndex !== position.index) {
    currentIndex = position.index;

    const url = base + videos[currentIndex].file;

    player.src = url;
    background.src = url;

    player.load();
    background.load();
  }

  if (player.readyState >= 1) {
    const target = Math.min(
      position.seconds,
      Math.max(0, player.duration - 0.2)
    );

    if (Math.abs(player.currentTime - target) > 2) {
      try {
        player.currentTime = target;
      } catch (error) {}
    }

    if (player.paused) {
      player.play().catch(() => {});
    }
  }

  if (background.readyState >= 1) {
    const target = Math.min(
      position.seconds,
      Math.max(0, background.duration - 0.2)
    );

    if (Math.abs(background.currentTime - target) > 0.5) {
      try {
        background.currentTime = target;
      } catch (error) {}
    }

    if (background.paused) {
      background.play().catch(() => {});
    }
  }
}

player.addEventListener("loadedmetadata", synchronize);
background.addEventListener("loadedmetadata", synchronize);

setInterval(synchronize, 3000);
synchronize();

/* NEU: Videoformat automatisch anpassen */
function fitPlayer() {
  if (!player.videoWidth || !player.videoHeight) return;

  const videoRatio = player.videoWidth / player.videoHeight;
  const screenRatio = window.innerWidth / window.innerHeight;

  if (videoRatio > screenRatio) {
    player.style.width = "100vw";
    player.style.height = "auto";
  } else {
    player.style.width = "auto";
    player.style.height = "100vh";
  }
}

player.addEventListener("loadedmetadata", fitPlayer);
window.addEventListener("resize", fitPlayer);

</script>
</body>
</html>
