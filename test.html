
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">
<title>CHAOTEN-TV | Neon Club</title>

<style>
* { box-sizing:border-box; }

html,body {
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#02030b;
}

.screen {
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:#02030b;
}

/* Neon-Hintergrund */
#visualizer {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

/* Video getrennt vom Hintergrund */
.video-area {
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:none;
}

#player {
  display:block;
  width:auto;
  height:auto;
  max-width:100%;
  max-height:100%;
  object-fit:contain;
  background:transparent;
  pointer-events:auto;
}

/* Unsichtbar bis Videoformat bekannt */
#player:not(.ready) {
  visibility:hidden;
}

#status {
  position:absolute;
  left:12px;
  bottom:10px;
  color:#b0b8d9;
  font:11px Arial,sans-serif;
  opacity:.7;
  pointer-events:none;
}
</style>
</head>

<body>
<div class="screen">
  <canvas id="visualizer"></canvas>

  <div class="video-area">
    <video id="player"
      autoplay muted playsinline controls
      preload="auto"></video>
  </div>

  <div id="status">CHAOTEN-TV Neon Test</div>
</div>

<script>
const base =
"https://github.com/tanjameier351-collab/Chaoten-TV/releases/download/v1.0/";

const videos = [
  ["Marc.-.Narben.machen.dich.harter.-.Marc.1080p.mp4",209],
  ["1004.1.mp4",273],
  ["Marc.-.Afther.Midnight.Velvet.Nights.-.Stay.Until.Sunrise.-.Marc.1080p.mp4",276],
  ["Marc.-.Beyond.The.Night.-.Marc.1080p.mp4",375],
  ["Marc.-.Country.The.Thinks.That.Stay.-.Marc.1080p.mp4",268],
  ["MARC.BREAK.THE.STATIC.Epic.Festival.EDM.Experience.Official.Music.Video.-.Marc.1080p.mp4",231]
];

const player=document.getElementById("player");
const canvas=document.getElementById("visualizer");
const ctx=canvas.getContext("2d");
const status=document.getElementById("status");

const start=Date.UTC(2026,10,13,0,0,0);
const total=videos.reduce((s,v)=>s+v[1],0);

let currentIndex=-1;
let lastSeek=0;
let loading=false;

/* Sendezeit berechnen */
function position(){
  let seconds=
    Math.max(0,(Date.now()-start)/1000)%total;

  for(let i=0;i<videos.length;i++){
    if(seconds<videos[i][1]){
      return {index:i,seconds};
    }
    seconds-=videos[i][1];
  }
  return {index:0,seconds:0};
}

/* Videoformat korrekt anzeigen */
function sizeVideo(){
  if(!player.videoWidth || !player.videoHeight)
    return;

  const ratio=player.videoWidth/player.videoHeight;
  const screenRatio=innerWidth/innerHeight;

  if(ratio>screenRatio){
    player.style.width="100vw";
    player.style.height="auto";
  } else {
    player.style.width="auto";
    player.style.height="100vh";
  }

  player.classList.add("ready");
}

window.addEventListener("resize",sizeVideo);

/* Video starten */
function loadVideo(index,seconds){
  loading=true;
  currentIndex=index;
  player.classList.remove("ready");

  player.src=base+videos[index][0];
  player.load();

  player.onloadedmetadata=()=>{
    sizeVideo();

    const maxTime=Math.max(
      0,player.duration-0.3
    );

    const target=Math.min(seconds,maxTime);

    if(target>0.5){
      try { player.currentTime=target; }
      catch(e){}
    }

    loading=false;
    player.play().catch(()=>{});
  };
}

/* Schonende Synchronisierung */
function sync(){
  const pos=position();

  if(currentIndex!==pos.index){
    loadVideo(pos.index,pos.seconds);
    return;
  }

  if(loading || player.readyState<2)
    return;

  const difference=
    Math.abs(player.currentTime-pos.seconds);

  /* Nur bei grosser Abweichung korrigieren */
  if(difference>15 &&
     Date.now()-lastSeek>30000){

    lastSeek=Date.now();

    try {
      player.currentTime=pos.seconds;
    } catch(e){}
  }

  if(player.paused && !player.ended){
    player.play().catch(()=>{});
  }
}

player.addEventListener("ended",sync);
setInterval(sync,5000);
sync();

/* Canvas */
function resize(){
  const dpr=Math.min(devicePixelRatio||1,2);
  canvas.width=Math.round(innerWidth*dpr);
  canvas.height=Math.round(innerHeight*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}

window.addEventListener("resize",resize);
resize();

/* Breite Neon-Lichtbaender */
const colors=[
  ["#00f5ff","#168bff"],
  ["#287bff","#7845ff"],
  ["#9b45ff","#ff39cb"]
];

function ribbon(side,layer,t,energy,w,h){
  const dir=side===0?1:-1;
  const origin=side===0?0:w;
  const reach=w*.48;
  const center=h*.5;

  const upper=[];
  const lower=[];

  for(let i=0;i<=100;i++){
    const p=i/100;
    const x=origin+dir*p*reach;

    const envelope=Math.sin(Math.PI*p);

    const wave=
      Math.sin(p*9-t*(1.4+layer*.2)+layer)
      *(75+energy*110);

    const spread=
      (layer-1)*h*.2*envelope;

    const y=center+spread+wave*envelope;

    /* Deutlich breitere Baender */
    const half=
      (45+energy*60)*
      (.3+.7*envelope);

    upper.push([x,y-half]);
    lower.push([x,y+half]);
  }

  ctx.beginPath();

  upper.forEach((p,i)=>{
    if(i===0)ctx.moveTo(...p);
    else ctx.lineTo(...p);
  });

  lower.reverse().forEach(p=>{
    ctx.lineTo(...p);
  });

  ctx.closePath();

  const gradient=ctx.createLinearGradient(
    0,center-h*.4,
    0,center+h*.4
  );

  gradient.addColorStop(0,colors[layer][0]);
  gradient.addColorStop(1,colors[layer][1]);

  ctx.save();

  /* Breiter weicher Lichtschein */
  ctx.shadowBlur=65;
  ctx.shadowColor=colors[layer][0];
  ctx.globalAlpha=.35;
  ctx.fillStyle=gradient;
  ctx.fill();

  /* Sichtbarer Bandkoerper */
  ctx.shadowBlur=25;
  ctx.globalAlpha=.72;
  ctx.fill();

  /* Dezente Lichtkante */
  ctx.globalAlpha=.8;
  ctx.lineWidth=1.5;
  ctx.strokeStyle=colors[layer][0];
  ctx.stroke();

  ctx.restore();
}

/* Animation */
function draw(ms){
  const w=innerWidth;
  const h=innerHeight;
  const t=ms*.001;

  ctx.clearRect(0,0,w,h);

  const bg=ctx.createLinearGradient(0,0,w,h);
  bg.addColorStop(0,"#020818");
  bg.addColorStop(.5,"#0a051d");
  bg.addColorStop(1,"#020818");

  ctx.fillStyle=bg;
  ctx.fillRect(0,0,w,h);

  const energy=
    .65+
    .2*Math.sin(t*2.5)+
    .15*Math.sin(t*5.2);

  for(let side=0;side<2;side++){
    for(let layer=0;layer<3;layer++){
      ribbon(side,layer,t,energy,w,h);
    }
  }

  requestAnimationFrame(draw);
}

requestAnimationFrame(draw);
</script>
</body>
</html>
