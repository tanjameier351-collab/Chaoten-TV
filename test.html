
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHAOTEN-TV | Equalizer Test</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}

.screen {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: #000;
}

/* Verschwommener Videohintergrund */
#background {
  position: absolute;
  inset: -10%;
  width: 120%;
  height: 120%;
  object-fit: cover;
  filter: blur(35px) brightness(0.45);
  pointer-events: none;
}

/* Dezente Clubbeleuchtung */
.ambient {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(
      ellipse at 10% 55%,
      rgba(0, 170, 255, 0.18),
      transparent 40%
    ),
    radial-gradient(
      ellipse at 90% 55%,
      rgba(85, 45, 220, 0.20),
      transparent 40%
    );
}

/* Equalizer links und rechts */
.equalizer {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 32%;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: clamp(3px, 0.55vw, 9px);
  pointer-events: none;
  overflow: hidden;
}

.equalizer.left {
  left: 0;
}

.equalizer.right {
  right: 0;
}

.bar {
  width: clamp(3px, 0.65vw, 10px);
  height: 32%;
  border-radius: 3px;
  transform: scaleY(0.4);
  transform-origin: center;
  background: linear-gradient(
    to top,
    rgba(0, 100, 255, 0.75),
    rgba(0, 225, 255, 0.95) 55%,
    rgba(125, 85, 255, 0.85)
  );
  box-shadow:
    0 0 8px rgba(0, 190, 255, 0.55),
    0 0 18px rgba(0, 110, 255, 0.25);
  opacity: 0.85;
  animation: pulse var(--speed) ease-in-out infinite alternate;
  animation-delay: var(--delay);
}

@keyframes pulse {
  0% {
    transform: scaleY(0.12);
    opacity: 0.55;
  }

  35% {
    transform: scaleY(0.65);
    opacity: 0.85;
  }

  70% {
    transform: scaleY(0.35);
    opacity: 0.7;
  }

  100% {
    transform: scaleY(1);
    opacity: 1;
  }
}

/* Hauptvideo */
#player {
  position: absolute;
  top: 50%;
  left: 50%;
  width: auto;
  height: 100vh;
  max-width: 100vw;
  object-fit: contain;
  transform: translate(-50%, -50%);
  background: transparent;
}

@media (prefers-reduced-motion: reduce) {
  .bar {
    animation: none;
    transform: scaleY(0.45);
  }
}
</style>
</head>

<body>

<div class="screen">

  <video id="background" muted playsinline></video>

  <div class="ambient"></div>

  <div class="equalizer left" id="equalizerLeft"></div>
  <div class="equalizer right" id="equalizerRight"></div>

  <video id="player" autoplay muted playsinline controls></video>

</div>

<script>
/* ORIGINAL-PLAYLIST */

const base =
"https://github.com/tanjameier351-collab/Chaoten-TV/releases/download/v1.0/";

const videos = [
  {
    name: "Narben machen dich härter",
    file: "Marc.-.Narben.machen.dich.harter.-.Marc.1080p.mp4",
    duration: 209
  },
  {
    name: "1004",
    file: "1004.1.mp4",
    duration: 273
  },
  {
    name: "After Midnight - Velvet Nights",
    file: "Marc.-.Afther.Midnight.Velvet.Nights.-.Stay.Until.Sunrise.-.Marc.1080p.mp4",
    duration: 276
  },
  {
    name: "Beyond The Night",
    file: "Marc.-.Beyond.The.Night.-.Marc.1080p.mp4",
    duration: 375
  },
  {
    name: "The Things That Stay",
    file: "Marc.-.Country.The.Thinks.That.Stay.-.Marc.1080p.mp4",
    duration: 268
  },
  {
    name: "Break The Static",
    file: "MARC.BREAK.THE.STATIC.Epic.Festival.EDM.Experience.Official.Music.Video.-.Marc.1080p.mp4",
    duration: 231
  }
];

const player = document.getElementById("player");
const background = document.getElementById("background");

const sendestart = Date.UTC(2026, 10, 13, 0, 0, 0);

const totalDuration = videos.reduce(
  (sum, video) => sum + video.duration, 0
);

let currentIndex = -1;

function getPosition() {
  let elapsed =
    Math.max(0, (Date.now() - sendestart) / 1000)
    % totalDuration;

  for (let i = 0; i < videos.length; i++) {
    if (elapsed < videos[i].duration) {
      return { index: i, seconds: elapsed };
    }
    elapsed -= videos[i].duration;
  }

  return { index: 0, seconds: 0 };
}

function synchronize() {
  const position = getPosition();

  if (currentIndex !== position.index) {
    currentIndex = position.index;

    const url = base + videos[currentIndex].file;

    player.src = url;
    background.src = url;

    player.load();
    background.load();
  }

  if (player.readyState >= 1) {
    const target = Math.min(
      position.seconds,
      Math.max(0, player.duration - 0.2)
    );

    if (Math.abs(player.currentTime - target) > 2) {
      try {
        player.currentTime = target;
      } catch (error) {}
    }

    if (player.paused) {
      player.play().catch(() => {});
    }
  }

  if (background.readyState >= 1) {
    const target = Math.min(
      position.seconds,
      Math.max(0, background.duration - 0.2)
    );

    if (Math.abs(background.currentTime - target) > 0.5) {
      try {
        background.currentTime = target;
      } catch (error) {}
    }

    if (background.paused) {
      background.play().catch(() => {});
    }
  }
}

player.addEventListener("loadedmetadata", synchronize);
background.addEventListener("loadedmetadata", synchronize);

setInterval(synchronize, 3000);
synchronize();

/* Videoformat automatisch anpassen */
function fitPlayer() {
  if (!player.videoWidth || !player.videoHeight) return;

  const videoRatio = player.videoWidth / player.videoHeight;
  const screenRatio = window.innerWidth / window.innerHeight;

  if (videoRatio > screenRatio) {
    player.style.width = "100vw";
    player.style.height = "auto";
  } else {
    player.style.width = "auto";
    player.style.height = "100vh";
  }
}

player.addEventListener("loadedmetadata", fitPlayer);
window.addEventListener("resize", fitPlayer);

/* LEICHTER CSS-EQUALIZER */

function createEqualizer(elementId, mirrored = false) {
  const container = document.getElementById(elementId);

  const heights = [
    0.35, 0.55, 0.75, 0.48,
    0.92, 0.62, 0.82, 0.40,
    0.70, 0.95, 0.58, 0.78,
    0.45, 0.85, 0.65, 0.38
  ];

  const values = mirrored
    ? [...heights].reverse()
    : heights;

  values.forEach((height, i) => {
    const bar = document.createElement("div");
    bar.className = "bar";

    bar.style.height = `${height * 42}%`;

    bar.style.setProperty(
      "--speed",
      `${0.65 + ((i * 7) % 9) * 0.12}s`
    );

    bar.style.setProperty(
      "--delay",
      `${-((i * 3) % 11) * 0.17}s`
    );

    container.appendChild(bar);
  });
}

createEqualizer("equalizerLeft");
createEqualizer("equalizerRight", true);

</script>
</body>
</html>
