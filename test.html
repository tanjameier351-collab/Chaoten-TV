
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHAOTEN-TV Soundwave Test</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #02030b;
}

.screen {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: #02030b;
}

#visualizer {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

#player {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: transparent;
}

#status {
  position: absolute;
  bottom: 8px;
  left: 10px;
  color: #aab4d8;
  font: 11px Arial, sans-serif;
  opacity: 0.65;
  pointer-events: none;
}
</style>
</head>

<body>
<div class="screen">
  <canvas id="visualizer"></canvas>
  <video id="player" autoplay muted playsinline controls></video>
  <div id="status">Soundwave-Test</div>
</div>

<script>
const base =
"https://github.com/tanjameier351-collab/Chaoten-TV/releases/download/v1.0/";

const videos = [
  ["Marc.-.Narben.machen.dich.harter.-.Marc.1080p.mp4",209],
  ["1004.1.mp4",273],
  ["Marc.-.Afther.Midnight.Velvet.Nights.-.Stay.Until.Sunrise.-.Marc.1080p.mp4",276],
  ["Marc.-.Beyond.The.Night.-.Marc.1080p.mp4",375],
  ["Marc.-.Country.The.Thinks.That.Stay.-.Marc.1080p.mp4",268],
  ["MARC.BREAK.THE.STATIC.Epic.Festival.EDM.Experience.Official.Music.Video.-.Marc.1080p.mp4",231]
];

const player = document.getElementById("player");
const canvas = document.getElementById("visualizer");
const ctx = canvas.getContext("2d");
const status = document.getElementById("status");

const sendestart = Date.UTC(2026,10,13,0,0,0);
const total = videos.reduce((sum,v) => sum + v[1],0);

let currentIndex = -1;
let audioContext = null;
let analyser = null;
let frequencyData = null;
let audioReady = false;

function broadcastPosition() {
  let seconds =
    Math.max(0,(Date.now()-sendestart)/1000)%total;

  for(let i=0;i<videos.length;i++){
    if(seconds < videos[i][1]){
      return {index:i,seconds};
    }
    seconds -= videos[i][1];
  }

  return {index:0,seconds:0};
}

function sync() {
  const pos = broadcastPosition();

  if(currentIndex !== pos.index){
    currentIndex = pos.index;
    player.src = base + videos[pos.index][0];
    player.load();
  }

  if(player.readyState >= 1){
    const duration = Number.isFinite(player.duration)
      ? player.duration
      : videos[pos.index][1];

    const target = Math.min(
      pos.seconds,Math.max(0,duration-0.2)
    );

    if(Math.abs(player.currentTime-target)>2){
      try { player.currentTime=target; }
      catch(e){}
    }

    if(player.paused){
      player.play().catch(()=>{});
    }
  }
}

player.addEventListener("loadedmetadata",sync);
player.addEventListener("ended",sync);
setInterval(sync,3000);
sync();

/*
  Audioanalyse nur versuchen, wenn der
  Benutzer sie ausdrücklich aktiviert.
  Bei externen Videoquellen kann CORS
  die Analyse verhindern.
*/
async function enableAudioAnalysis(){
  if(audioReady) return;

  try {
    const AC = window.AudioContext ||
               window.webkitAudioContext;

    if(!AC) return;

    audioContext = new AC();
    analyser = audioContext.createAnalyser();
    analyser.fftSize = 256;
    analyser.smoothingTimeConstant = 0.82;

    const source =
      audioContext.createMediaElementSource(player);

    source.connect(analyser);
    analyser.connect(audioContext.destination);

    frequencyData =
      new Uint8Array(analyser.frequencyBinCount);

    await audioContext.resume();
    audioReady = true;
    status.textContent = "Audioanalyse aktiviert";
  } catch(e) {
    status.textContent = "Animierter Soundwave-Modus";
  }
}

player.addEventListener("play",()=>{
  if(audioContext && audioContext.state==="suspended"){
    audioContext.resume().catch(()=>{});
  }
});

/* Canvas an die Bildschirmgroesse anpassen */
function resize(){
  const dpr = Math.min(window.devicePixelRatio||1,2);
  canvas.width = Math.round(innerWidth*dpr);
  canvas.height = Math.round(innerHeight*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}

window.addEventListener("resize",resize);
resize();

function draw(time){
  const w = innerWidth;
  const h = innerHeight;
  const t = time*0.001;

  ctx.clearRect(0,0,w,h);

  const gradient = ctx.createLinearGradient(0,0,w,h);
  gradient.addColorStop(0,"#030719");
  gradient.addColorStop(0.5,"#09051b");
  gradient.addColorStop(1,"#020b18");

  ctx.fillStyle = gradient;
  ctx.fillRect(0,0,w,h);

  let energy = 0.5;

  if(audioReady && analyser){
    analyser.getByteFrequencyData(frequencyData);

    let sum=0;
    for(let i=0;i<frequencyData.length;i++){
      sum += frequencyData[i];
    }

    const average =
      sum/frequencyData.length/255;

    if(average>0.005){
      energy = Math.max(0.15,average*2.5);
    } else {
      energy = 0.35+0.15*Math.sin(t*2.2);
    }
  } else {
    energy = 0.45+0.18*Math.sin(t*2.4);
  }

  const colors=[
    "#00eaff",
    "#288cff",
    "#7957ff",
    "#c04cff"
  ];

  /* Geschwungene, leuchtende Soundwaves */
  for(let layer=0;layer<4;layer++){
    ctx.beginPath();

    const amplitude =
      (18+layer*13)*(0.65+energy);

    const centerY = h*0.5;

    for(let x=0;x<=w;x+=3){
      const nx=x/w;

      const wave =
        Math.sin(nx*17-t*(1.5+layer*0.12)+layer)
        *amplitude;

      const detail =
        Math.sin(nx*37+t*2.1+layer)
        *amplitude*0.25;

      const envelope =
        Math.pow(Math.sin(Math.PI*nx),0.7);

      const y=centerY+
        (wave+detail)*envelope+
        (layer-1.5)*19;

      if(x===0) ctx.moveTo(x,y);
      else ctx.lineTo(x,y);
    }

    ctx.strokeStyle=colors[layer];
    ctx.lineWidth=2.5;
    ctx.shadowBlur=22;
    ctx.shadowColor=colors[layer];
    ctx.globalAlpha=0.8;
    ctx.stroke();
  }

  ctx.globalAlpha=1;
  ctx.shadowBlur=0;

  requestAnimationFrame(draw);
}

requestAnimationFrame(draw);

/*
  Audioanalyse kann ueber die Konsole
  mit enableAudioAnalysis() getestet werden.
  Standardmaessig bleibt der Tonweg
  des funktionierenden Players erhalten.
*/
</script>
</body>
</html>
