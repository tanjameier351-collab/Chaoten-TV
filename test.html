
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHAOTEN-TV | Soundwave Test</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}

.screen {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: #000;
}

#background {
  position: absolute;
  inset: -10%;
  width: 120%;
  height: 120%;
  object-fit: cover;
  filter: blur(35px) brightness(0.45);
  pointer-events: none;
}

#waves {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

#player {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: transparent;
}
</style>
</head>

<body>
<div class="screen">
  <video id="background" muted playsinline></video>
  <canvas id="waves"></canvas>
  <video id="player" autoplay muted playsinline controls></video>
</div>

<script>
/* ORIGINAL-SENDER */

const base =
"https://github.com/tanjameier351-collab/Chaoten-TV/releases/download/v1.0/";

const videos = [
  {
    name: "Narben machen dich härter",
    file: "Marc.-.Narben.machen.dich.harter.-.Marc.1080p.mp4",
    duration: 209
  },
  {
    name: "1004",
    file: "1004.1.mp4",
    duration: 273
  },
  {
    name: "After Midnight - Velvet Nights",
    file: "Marc.-.Afther.Midnight.Velvet.Nights.-.Stay.Until.Sunrise.-.Marc.1080p.mp4",
    duration: 276
  },
  {
    name: "Beyond The Night",
    file: "Marc.-.Beyond.The.Night.-.Marc.1080p.mp4",
    duration: 375
  },
  {
    name: "The Things That Stay",
    file: "Marc.-.Country.The.Thinks.That.Stay.-.Marc.1080p.mp4",
    duration: 268
  },
  {
    name: "Break The Static",
    file: "MARC.BREAK.THE.STATIC.Epic.Festival.EDM.Experience.Official.Music.Video.-.Marc.1080p.mp4",
    duration: 231
  }
];

const player = document.getElementById("player");
const background = document.getElementById("background");

const sendestart = Date.UTC(2026, 10, 13, 0, 0, 0);

const totalDuration = videos.reduce(
  (sum, video) => sum + video.duration, 0
);

let currentIndex = -1;

function getPosition() {
  let elapsed =
    Math.max(0, (Date.now() - sendestart) / 1000)
    % totalDuration;

  for (let i = 0; i < videos.length; i++) {
    if (elapsed < videos[i].duration) {
      return { index: i, seconds: elapsed };
    }
    elapsed -= videos[i].duration;
  }

  return { index: 0, seconds: 0 };
}

function synchronize() {
  const position = getPosition();

  if (currentIndex !== position.index) {
    currentIndex = position.index;

    const url = base + videos[currentIndex].file;

    player.src = url;
    background.src = url;

    player.load();
    background.load();
  }

  if (player.readyState >= 1) {
    const target = Math.min(
      position.seconds,
      Math.max(0, player.duration - 0.2)
    );

    if (Math.abs(player.currentTime - target) > 2) {
      try {
        player.currentTime = target;
      } catch (error) {}
    }

    if (player.paused) {
      player.play().catch(() => {});
    }
  }

  if (background.readyState >= 1) {
    const target = Math.min(
      position.seconds,
      Math.max(0, background.duration - 0.2)
    );

    if (Math.abs(background.currentTime - target) > 0.5) {
      try {
        background.currentTime = target;
      } catch (error) {}
    }

    if (background.paused) {
      background.play().catch(() => {});
    }
  }
}

player.addEventListener("loadedmetadata", synchronize);
background.addEventListener("loadedmetadata", synchronize);

setInterval(synchronize, 3000);
synchronize();

/* NEUE LEICHTE SOUNDWAVE-EBENE */

const canvas = document.getElementById("waves");
const ctx = canvas.getContext("2d");

let width = 0;
let height = 0;

function resizeWaves() {
  width = window.innerWidth;
  height = window.innerHeight;

  canvas.width = width;
  canvas.height = height;
}

window.addEventListener("resize", resizeWaves);
resizeWaves();

const colors = [
  "0,235,255",
  "42,125,255",
  "145,70,255",
  "235,50,205"
];

function drawWaves(ms) {
  const t = ms * 0.001;

  ctx.clearRect(0, 0, width, height);

  for (let side = 0; side < 2; side++) {
    const left = side === 0;
    const startX = left ? 0 : width;
    const direction = left ? 1 : -1;
    const reach = width * 0.46;

    for (let layer = 0; layer < 4; layer++) {
      const rgb = colors[layer];

      const center =
        height * (0.34 + layer * 0.105);

      const amplitude = height * 0.075;

      const path = new Path2D();

      for (let i = 0; i <= 80; i++) {
        const p = i / 80;
        const x = startX + direction * p * reach;

        const envelope =
          Math.sin(Math.PI * p);

        const motion =
          Math.sin(
            p * 11 - t * (1.1 + layer * 0.12)
            + layer * 1.5
          );

        const detail =
          Math.sin(p * 22 + t * 1.6 + layer)
          * 0.22;

        const y = center +
          (motion + detail) *
          amplitude * envelope;

        if (i === 0) path.moveTo(x, y);
        else path.lineTo(x, y);
      }

      /* Weicher breiter Lichtschleier */
      ctx.strokeStyle = `rgba(${rgb},0.08)`;
      ctx.lineWidth = 38;
      ctx.stroke(path);

      /* Mittlerer Neon-Glow */
      ctx.strokeStyle = `rgba(${rgb},0.22)`;
      ctx.lineWidth = 16;
      ctx.stroke(path);

      /* Leuchtender Kern */
      ctx.strokeStyle = `rgba(${rgb},0.65)`;
      ctx.lineWidth = 3;
      ctx.stroke(path);
    }
  }

  requestAnimationFrame(drawWaves);
}

/* Begrenzte Bildrate zur Entlastung */
let lastFrame = 0;

function animate(ms) {
  requestAnimationFrame(animate);

  if (ms - lastFrame < 33) return;
  lastFrame = ms;

  drawFrame(ms);
}

function drawFrame(ms) {
  drawWaves(ms);
}

/* Nur eine Animationsschleife verwenden */
function drawWaves(ms) {
  const t = ms * 0.001;

  ctx.clearRect(0, 0, width, height);

  for (let side = 0; side < 2; side++) {
    const startX = side === 0 ? 0 : width;
    const direction = side === 0 ? 1 : -1;
    const reach = width * 0.46;

    for (let layer = 0; layer < 4; layer++) {
      const rgb = colors[layer];
      const center = height * (0.34 + layer * 0.105);
      const amplitude = height * 0.075;

      const path = new Path2D();

      for (let i = 0; i <= 80; i++) {
        const p = i / 80;
        const x = startX + direction * p * reach;
        const envelope = Math.sin(Math.PI * p);

        const motion =
          Math.sin(
            p * 11 - t * (1.1 + layer * 0.12)
            + layer * 1.5
          );

        const detail =
          Math.sin(p * 22 + t * 1.6 + layer)
          * 0.22;

        const y = center +
          (motion + detail) *
          amplitude * envelope;

        if (i === 0) path.moveTo(x, y);
        else path.lineTo(x, y);
      }

      ctx.strokeStyle = `rgba(${rgb},0.08)`;
      ctx.lineWidth = 38;
      ctx.stroke(path);

      ctx.strokeStyle = `rgba(${rgb},0.22)`;
      ctx.lineWidth = 16;
      ctx.stroke(path);

      ctx.strokeStyle = `rgba(${rgb},0.65)`;
      ctx.lineWidth = 3;
      ctx.stroke(path);
    }
  }
}

requestAnimationFrame(animate);
</script>
</body>
</html>
